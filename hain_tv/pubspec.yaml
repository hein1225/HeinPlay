name: hain_tv
description: "海因影视 TV 版"
publish_to: 'none'
version: 1.4.0+24

environment:
  # 鸿蒙移植方案B：兼容 flutter_flutter 3.41.10-ohos (Dart 3.11.5)。
  # 同时仍满足 Android/Windows 基线 (官方 Flutter 3.47.2, Dart >=3.12)。
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  video_player: ^2.11.0
  video_player_android: ^2.11.0
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2
  shared_preferences_platform_interface: ^2.4.1
  permission_handler: ^12.0.3
  dio: ^5.11.0
  open_filex: ^4.4.0
  visibility_detector: ^0.4.0+2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  xml: ^7.0.1
  wakelock_plus: ^1.7.0
  screen_brightness: ^2.1.1
  volume_controller: ^3.5.0
  flutter_js: ^0.8.2
  window_manager: ^0.5.2
  package_info_plus: ^10.1.2
  win32: ^6.4.0
  # Windows 手柄（XInput）轮询：用 dart:ffi 直接调用系统自带的 xinput*.dll，
  # 把 A/B/方向键映射为确认/返回/方向（见 services/gamepad_input_service.dart）。
  ffi: ^2.1.0
  # fvp 插件内部用 package:logging 转发 libmdk 的原生日志：
  # `Logger('mdk')` = libmdk 内部日志（reader/demuxer/解码决策），
  # `Logger('fvp')` = fvp 插件自身日志。但 package:logging 在**没有任何
  # listener** 时会把日志静默丢弃，且 root 默认 Level.INFO 会把 debug/all
  # 级别直接过滤掉——而本项目此前从未用过 logging，于是 libmdk 的内部日志
  # 一条都到不了 App 侧（= 「fvp 卡住但 App 层全链路日志正常」无法定位的根因）。
  # 现由 utils/mdk_log_bridge.dart 把这些日志接入 AppLogger（受「获取日志」
  # 开关控制），因此显式声明该依赖（原为 transitive）。
  logging: ^1.3.0
  fvp: 0.37.0
  # fvp 播放经本地代理的 AES-128 加密 HLS 会卡死（libmdk 解密缺陷），改由本地代理
  # 取 key 并逐段 AES-128-CBC 解密后吐明文绕开。仅 fvp 后端使用。
  pointycastle: ^3.9.0
  vlc_player:
    path: deps/vlc_player_windows

dependency_overrides:
  # permission_handler_windows 0.2.1 使用已废弃的 /await 与
  # <experimental/coroutine> 在新版 MSVC 中构建失败，使用本地修正副本。
  permission_handler_windows:
    path: deps/permission_handler_windows
  # video_player_android 插件内部自行创建 ExoPlayer，无法从 Dart 层注入 LoadControl。
  # 使用本地副本，在创建 ExoPlayer 时反射读取 HeinPlay 的分级缓冲配置。
  video_player_android:
    path: deps/video_player_android
  # 注：曾加过 `fvp: path: deps/fvp-0.37.0-patched`（用 prepare(position:) 定位续播点），
  # 2026-09-24 23:2x 实测反而导致 libmdk 从第 0 片顺序下载、init 拖到 16-32s 并超过
  # openTimeout 误报播放失败，已**整体移除**该本地补丁与覆盖，fvp 回到 pub.dev 0.37.0。
  # audio_video_progress_bar 0.11.0 仍使用 Flutter 3.x 已移除的 textTheme.bodyText1，
  # 强制覆盖到 2.0.3 以兼容 Flutter 3.44.6 的新 TextTheme API。
  audio_video_progress_bar: ^2.0.3
  # shared_preferences 官方 pub.dev 版未声明 platforms.ohos，联邦插件机制要求
  # 主包在自身 pubspec 里写 `ohos: default_package: shared_preferences_ohos` 才会
  # 把鸿蒙实现接进 dart_plugin_registrant，否则 ohos 构建启动即抛
  # MissingPluginException(getAll on plugins.flutter.io/shared_preferences)。
  # 因此主包也必须指向 OpenHarmony TPC 的 git 版（其 pubspec 含 ohos 段）。
  shared_preferences:
    git:
      url: https://atomgit.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: master
  shared_preferences_ohos:
    git:
      url: https://atomgit.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences_ohos
      ref: master

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash/splash_tv.jpeg
    - assets/images/splash/splash_mobile.jpeg

flutter_launcher_icons:
  image_path: "../plan/ico.png"
  android:
    generate: true
    adaptive_icon_background: "#00000000"
    adaptive_icon_foreground: "../plan/mo_ico.png"
  windows:
    generate: true
    image_path: "../plan/mo_ico.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "../plan/ico.png"
  web:
    generate: true
    image_path: "../plan/ico.png"
    background_color: "#0A0A0F"
    theme_color: "#00C8E0"
