name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.1.6），构建成功后会自动创建 v1.1.6 tag 并发布 Release'
        required: true
        type: string
      upload-artifacts:
        description: '是否上传构建产物'
        required: true
        default: true
        type: boolean

env:
  RELEASE_TAG: ${{ inputs.version }}
  # mpv 内核依赖来自独立仓库 hein1225/HeinPlayMPV（固定 tag 的 Release 资产）。
  # HeinPlay 仓库本身不含任何 mpv 内核文件（源码 / 二进制 / 构建脚本）。
  # 资产清单与落地路径见 HeinPlayMPV/docs/heinplay-integration.md
  MPV_DEPS_TAG: 'mpv-v1.4.1'
  MPV_DEPS_BASE: 'https://github.com/hein1225/HeinPlayMPV/releases/download'

jobs:
  build-tv:
    name: Build TV APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hain_tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Decode TV keystore
        run: |
          echo "${{ secrets.TV_KEYSTORE_BASE64 }}" | base64 -d > android/app/hain_tv_keystore.jks

      - name: Write TV key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=hain_tv_keystore.jks
          storePassword=${{ secrets.TV_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.TV_KEY_ALIAS }}
          keyPassword=${{ secrets.TV_KEY_PASSWORD }}
          EOF

      - name: Fetch mpv dependencies (HeinPlayMPV)
        run: |
          set -euo pipefail
          BASE="$MPV_DEPS_BASE/$MPV_DEPS_TAG"
          curl -fsSL --retry 3 -o mpv-headers.tar.gz "$BASE/mpv-headers.tar.gz"
          curl -fsSL --retry 3 -o android-arm64-v8a.tar.gz "$BASE/android-arm64-v8a.tar.gz"
          curl -fsSL --retry 3 -o android-armeabi-v7a.tar.gz "$BASE/android-armeabi-v7a.tar.gz"
          mkdir -p third_party android/app/src/main/jniLibs
          tar -xzf mpv-headers.tar.gz -C third_party/
          tar -xzf android-arm64-v8a.tar.gz -C android/app/src/main/jniLibs/
          tar -xzf android-armeabi-v7a.tar.gz -C android/app/src/main/jniLibs/
          ls -l third_party/include/mpv android/app/src/main/jniLibs/arm64-v8a

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build TV APK
        run: flutter build apk --target lib/main_tv.dart --flavor tv --release

      - name: Rename artifact
        run: |
          VERSION="$RELEASE_TAG"
          # 产物统一输出到「仓库根 dist」（本 job 的 working-directory 是 hain_tv）
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-tv-release.apk "../dist/heinplay-${VERSION}-tv.apk"

      - name: Upload TV APK
        if: ${{ inputs.upload-artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-tv-apk
          path: dist/heinplay-*-tv.apk
          if-no-files-found: error

  # 【独立工程】tvLegacy APK 由仓库根的 hain_tv_legacy/ 构建（与 hain_tv/ 平级）。
  # 它与主工程不共用工具链：Flutter 3.32.8 / Dart 3.8.1 + Gradle 8.12 + AGP 8.7.3 + JDK 21，
  # 目标是 Android 5.0+（API 21）、mpv-only。故单独成一个 job，只共用仓库级签名 secrets。
  build-tvlegacy:
    name: Build tvLegacy APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hain_tv_legacy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 本工程固定 Flutter 3.32.8 + Gradle 8.12 工具链，必须配 JDK 21
          # （Gradle 8.12 内置的 Kotlin 解析不了更新版本的 JavaVersion）。
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.32.8（Dart 3.8.1）是最后一个原生支持 Android 5.0 / API 21 的稳定版，
          # 不可升到 3.35+（引擎改按 minSdk 24 构建）。
          flutter-version: '3.32.8'
          channel: 'stable'

      # 签名 secrets 沿用历史上 tvLegacy job 的同一组（secrets 属于仓库，与 workflow 无关）：
      #   TVLEGACY_KEYSTORE_BASE64 / TVLEGACY_KEYSTORE_PASSWORD /
      #   TVLEGACY_KEY_ALIAS / TVLEGACY_KEY_PASSWORD
      # keystore 里就是 android/app/heinplay-tvlegacy.jks 的那把密钥 —— 换掉它老用户将无法覆盖升级。
      - name: Decode tvLegacy keystore
        run: |
          echo "${{ secrets.TVLEGACY_KEYSTORE_BASE64 }}" | base64 -d > android/app/heinplay-tvlegacy.jks

      - name: Write tvLegacy key-tvlegacy.properties
        run: |
          cat > android/key-tvlegacy.properties <<EOF
          storeFile=heinplay-tvlegacy.jks
          storePassword=${{ secrets.TVLEGACY_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.TVLEGACY_KEY_ALIAS }}
          keyPassword=${{ secrets.TVLEGACY_KEY_PASSWORD }}
          EOF

      # android/gradle.properties 里的 org.gradle.java.home 是**本机 D 盘绝对路径**
      # （本机需要它来绕开 Android Studio 自带的 JBR 25.x）。runner 上没有该路径，
      # Gradle 会直接报 "Java home supplied is invalid" → 这里删掉，改由 JAVA_HOME 决定。
      - name: Drop local JDK pin
        run: sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties

      - name: Fetch mpv dependencies (HeinPlayMPV)
        run: |
          set -euo pipefail
          BASE="$MPV_DEPS_BASE/$MPV_DEPS_TAG"
          curl -fsSL --retry 3 -o mpv-headers.tar.gz "$BASE/mpv-headers.tar.gz"
          curl -fsSL --retry 3 -o android-tvlegacy-arm64-v8a.tar.gz "$BASE/android-tvlegacy-arm64-v8a.tar.gz"
          curl -fsSL --retry 3 -o android-tvlegacy-armeabi-v7a.tar.gz "$BASE/android-tvlegacy-armeabi-v7a.tar.gz"
          mkdir -p third_party android/app/src/main/jniLibs
          tar -xzf mpv-headers.tar.gz -C third_party/
          tar -xzf android-tvlegacy-arm64-v8a.tar.gz -C android/app/src/main/jniLibs/
          tar -xzf android-tvlegacy-armeabi-v7a.tar.gz -C android/app/src/main/jniLibs/
          ls -l third_party/include/mpv android/app/src/main/jniLibs/arm64-v8a

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build tvLegacy APK
        run: flutter build apk --target lib/main_tv.dart --flavor tvlegacy --release

      - name: Rename artifact
        run: |
          VERSION="$RELEASE_TAG"
          # 产物统一输出到「仓库根 dist」（本 job 的 working-directory 是 hain_tv_legacy）
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-tvlegacy-release.apk "../dist/heinplay-${VERSION}-tvLegacy.apk"

      # 升级红线自动校验：tvLegacy 的 applicationId 与 keystore 必须与已发布版连续，
      # 否则老用户无法覆盖升级。证书指纹不属于机密，可硬编码比对。
      - name: Verify signing certificate
        run: |
          EXPECTED="9F:0D:EA:55:84:0B:C4:8B:F6:E5:62:55:98:E1:AA:08:77:9C:72:A8:EA:21:78:04:2E:EC:6B:0E:A3:D2:C8:0C"
          APK="../dist/heinplay-${RELEASE_TAG}-tvLegacy.apk"
          ACTUAL=$(keytool -printcert -jarfile "$APK" | grep -i 'SHA256:' | head -1 | tr -d '[:space:]' | sed 's/^[Ss][Hh][Aa]256://')
          echo "期望指纹: $EXPECTED"
          echo "实际指纹: $ACTUAL"
          if [ "${ACTUAL^^}" != "$EXPECTED" ]; then
            echo "::error::签名证书指纹不一致 —— 该 APK 无法覆盖升级老版本，已中断发布"
            exit 1
          fi
          echo "签名指纹校验通过，可覆盖升级。"

      - name: Upload tvLegacy APK
        if: ${{ inputs.upload-artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-tvlegacy-apk
          path: dist/heinplay-*-tvLegacy.apk
          if-no-files-found: error

  build-mobile:
    name: Build Mobile APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hain_tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Decode Mobile keystore
        run: |
          echo "${{ secrets.MOBILE_KEYSTORE_BASE64 }}" | base64 -d > android/app/heinplay-mobile.jks

      - name: Write Mobile key.properties
        run: |
          cat > android/key-mobile.properties <<EOF
          storeFile=heinplay-mobile.jks
          storePassword=${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.MOBILE_KEY_ALIAS }}
          keyPassword=${{ secrets.MOBILE_KEY_PASSWORD }}
          EOF

      - name: Fetch mpv dependencies (HeinPlayMPV)
        run: |
          set -euo pipefail
          BASE="$MPV_DEPS_BASE/$MPV_DEPS_TAG"
          curl -fsSL --retry 3 -o mpv-headers.tar.gz "$BASE/mpv-headers.tar.gz"
          curl -fsSL --retry 3 -o android-arm64-v8a.tar.gz "$BASE/android-arm64-v8a.tar.gz"
          curl -fsSL --retry 3 -o android-armeabi-v7a.tar.gz "$BASE/android-armeabi-v7a.tar.gz"
          mkdir -p third_party android/app/src/main/jniLibs
          tar -xzf mpv-headers.tar.gz -C third_party/
          tar -xzf android-arm64-v8a.tar.gz -C android/app/src/main/jniLibs/
          tar -xzf android-armeabi-v7a.tar.gz -C android/app/src/main/jniLibs/
          ls -l third_party/include/mpv android/app/src/main/jniLibs/arm64-v8a

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Mobile APK
        run: flutter build apk --target lib/main_mobile.dart --flavor mobile --release

      - name: Rename artifact
        run: |
          VERSION="$RELEASE_TAG"
          # 产物统一输出到「仓库根 dist」（本 job 的 working-directory 是 hain_tv）
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-mobile-release.apk "../dist/heinplay-${VERSION}-mobile.apk"

      - name: Upload Mobile APK
        if: ${{ inputs.upload-artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-mobile-apk
          path: dist/heinplay-*-mobile.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Portable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hain_tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows 默认禁用长路径（MAX_PATH=260），flutter 插件 git 依赖的
      # example 路径超过限制会导致 `git checkout` 失败（Filename too long）。
      # 开启 core.longpaths 让 git 支持长路径，必须在 flutter pub get 之前。
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: git config --global core.longpaths true && flutter pub get

      # 桌面 mpv 壳的构建输入 `hain_tv/third_party/mpv-windows/`
      #   （官方预编译 libmpv-2.dll + mpv.lib + include/mpv/*.h，约 119MB）
      #   **未纳入 git**（124MB 超过 GitHub 单文件 100MB 上限），
      #   现统一从独立仓库 hein1225/HeinPlayMPV 的固定 tag Release 资产下载
      #   （见上一步 Fetch mpv dependencies）。
      - name: Fetch mpv dependencies (HeinPlayMPV)
        shell: pwsh
        run: |
          $base = "$env:MPV_DEPS_BASE/$env:MPV_DEPS_TAG"
          Invoke-WebRequest -Uri "$base/windows-mpv-x86_64.tar.gz" -OutFile "mpv-windows.tar.gz"
          New-Item -ItemType Directory -Force -Path "third_party" | Out-Null
          tar -xzf "mpv-windows.tar.gz" -C "third_party"
          Get-ChildItem -Recurse "third_party/mpv-windows" | Select-Object FullName

      - name: Build Windows release
        run: flutter build windows --target lib/main_windows.dart --release

      - name: Rename artifact
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          # 产物统一输出到「仓库根 dist」（本 job 的 working-directory 是 hain_tv）
          $distDir = "..\dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $sourceDir = "build\windows\x64\runner\Release"
          $destZip = "$distDir\heinplay-$version-windows-portable.zip"
          if (Test-Path $destZip) { Remove-Item $destZip -Force }

          # 分发包只收程序产物，排除运行期数据（登录态 / 日志 / 缓存 / 偏好）。
          # 否则解压覆盖时会用打包机的数据顶掉用户数据（症状：每次更新后都要重新登录）。
          $runtimeDataExcludes = @(
            'data\shared_preferences.json',
            'data\prefs_big',
            'data\app_logs',
            'data\cache',
            'data\support',
            'data\temp',
            'data\documents',
            'data\downloads',
            'data\windows_logs',
            'update'
          )

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $sourceRoot = (Resolve-Path $sourceDir).Path.TrimEnd('\')
          $excludedRel = New-Object System.Collections.Generic.List[string]
          $zipArchive = [System.IO.Compression.ZipFile]::Open(
              $destZip, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($file in Get-ChildItem -Path $sourceRoot -Recurse -File -Force) {
              $rel = $file.FullName.Substring($sourceRoot.Length + 1)
              $skip = $false
              foreach ($ex in $runtimeDataExcludes) {
                if (($rel -ieq $ex) -or ($rel -ilike "$ex\*")) { $skip = $true; break }
              }
              if ($skip) { $excludedRel.Add($rel); continue }
              $entryName = $rel.Replace('\', '/')
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                  $zipArchive, $file.FullName, $entryName,
                  [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
            }
          }
          finally {
            $zipArchive.Dispose()
          }

          Write-Output "已生成: $destZip"
          if ($excludedRel.Count -gt 0) {
            Write-Output "已排除运行期数据 $($excludedRel.Count) 项（不进入分发包）"
          }

      - name: Upload Windows artifact
        if: ${{ inputs.upload-artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-windows-portable
          path: dist/heinplay-*-windows-portable.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hain_tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      # 与 hain_tv/scripts/build_linux_appimage.sh 的 ensure_system_deps 检查项一一对应。
      # 该脚本「缺依赖只打印 apt 命令并退出」，所以这里必须一次装齐：
      #   pkg-config/libgtk-3-dev/libasound2-dev —— flutter build linux 与 ALSA（音量插件）
      #   ninja-build/cmake/clang               —— Flutter Linux 工具链
      #   patchelf/file/squashfs-tools/zsync    —— appimage-builder 打包与 .zsync 生成
      #   desktop-file-utils/fakeroot           —— appimage-builder 收尾步骤
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libgtk-3-dev libasound2-dev \
            ninja-build cmake clang \
            patchelf file squashfs-tools zsync \
            desktop-file-utils fakeroot \
            libepoxy-dev libx11-dev libgl1-mesa-dev libvulkan-dev

      # 注意：不需要 appimagetool，也不要为它装 FUSE。
      # appimage-builder 1.1.0 的 CreateAppImageCommand 只实例化
      # modules/prime 的 AppImagePrimer（自己下载 runtime-x86_64 + 用 mksquashfs 拼包、
      # 用 zsyncmake 生成 .zsync）；而 modules/appimage.py 的 AppImageCreator /
      # utils/appimagetool.py 属于「存在但从未被实例化」的遗留代码（create_appimage.py
      # 只 import 不调用）。因此打包全程不会调用 appimagetool，也不依赖 FUSE。
      - name: Fetch mpv dependencies (HeinPlayMPV)
        run: |
          set -euo pipefail
          BASE="$MPV_DEPS_BASE/$MPV_DEPS_TAG"
          curl -fsSL --retry 3 -o linux-mpv-x86_64.tar.gz "$BASE/linux-mpv-x86_64.tar.gz"
          sudo mkdir -p /opt/heinplay-mpv
          sudo tar -xzf linux-mpv-x86_64.tar.gz -C /opt/heinplay-mpv
          sudo cp -r /opt/heinplay-mpv/mpv-linux/. /opt/heinplay-mpv/
          # 链接期需要 libmpv.so（符号链接），运行期用 libmpv.so.2
          sudo ln -sf libmpv.so.2 /opt/heinplay-mpv/lib/libmpv.so
          echo "PKG_CONFIG_PATH=/opt/heinplay-mpv" >> "$GITHUB_ENV"
          ls -l /opt/heinplay-mpv

      - name: Install appimage-builder
        run: |
          # pipx 是最稳的安装方式（appimage-builder 官方推荐）。
          if ! command -v pipx >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages pipx
          fi
          pipx install appimage-builder
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 脚本自带：拒绝 /mnt 上的 Flutter、校验依赖、副本构建（产物落到仓库根 dist/）、
      # 抽取 Windows 图标、修补 appimage-builder 的 stripped 二进制架构检测。
      - name: Build Linux AppImage
        run: |
          flutter config --enable-linux-desktop
          bash scripts/build_linux_appimage.sh

      - name: Upload Linux artifact
        if: ${{ inputs.upload-artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-linux-appimage
          path: dist/heinplay-*-linux-x86_64.AppImage
          if-no-files-found: error

  # 【独立工程】HarmonyOS NEXT HAP 由仓库根的 hain_tv_ohos/ 构建（与其它平台平级）。
  #
  # 与其它平台的三个关键差异：
  #   1) 需要**专用 Flutter SDK**（OpenHarmony 移植版 flutter_flutter）与 DevEco
  #      工具链（ohpm / hvigor / node），官方 Flutter 不含 ohos 平台支持；
  #   2) HarmonyOS SDK（API 26）为华为**商业分发**，需登录下载，无法公开拉取 ——
  #      故由仓库变量 `vars.OHOS_SDK_URL` 提供下载地址；未配置时本 job **自动跳过**，
  #      不影响其它平台出包（`release` 的条件已相应放宽，见下）；
  #   3) 线上**没有鸿蒙签名材料** —— 因此**只出 unsigned.hap**（侧载用，由用户自行
  #      用 hokit 等工具签名后安装），**不构建 app**。
  #      发布版 .app 由本地签名构建后单独交付。
  build-ohos:
    name: Build HarmonyOS unsigned HAP
    runs-on: ubuntu-latest
    if: ${{ vars.OHOS_SDK_URL != '' }}
    defaults:
      run:
        working-directory: hain_tv_ohos
    env:
      FLUTTER_OHOS_TAG: '3.41.10-ohos-1.0.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # OpenHarmony 移植版 Flutter（与本地构建使用同一版本，避免产物差异）。
      - name: Setup Flutter (OpenHarmony)
        run: |
          git clone --depth 1 --branch "$FLUTTER_OHOS_TAG" \
            https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter_flutter"
          echo "$RUNNER_TEMP/flutter_flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_OHOS_HOME=$RUNNER_TEMP/flutter_flutter" >> "$GITHUB_ENV"

      # HarmonyOS SDK（商业分发，地址由仓库变量提供）。
      - name: Setup HarmonyOS SDK
        run: |
          mkdir -p "$RUNNER_TEMP/ohos-sdk"
          curl -fL --retry 3 "${{ vars.OHOS_SDK_URL }}" -o "$RUNNER_TEMP/ohos-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/ohos-sdk.tar.gz" -C "$RUNNER_TEMP/ohos-sdk"
          echo "DEVECO_SDK_HOME=$RUNNER_TEMP/ohos-sdk" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=$RUNNER_TEMP/ohos-sdk" >> "$GITHUB_ENV"

      - name: Get Flutter dependencies
        run: flutter pub get

      # 只构建 HAP（未签名）。**不构建 app** —— 发布版 .app 由本地签名构建后交付。
      - name: Build unsigned HAP
        run: flutter build hap --release -t lib/main_ohos.dart

      - name: Rename artifact
        run: |
          VERSION="$RELEASE_TAG"
          mkdir -p ../dist
          cp ohos/entry/build/default/outputs/default/entry-default-unsigned.hap \
            "../dist/heinplay-${VERSION}-ohos-unsigned.hap"

      - name: Upload HarmonyOS unsigned HAP
        if: ${{ inputs.upload-artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-ohos-unsigned-hap
          path: dist/heinplay-*-ohos-unsigned.hap
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-tv, build-tvlegacy, build-mobile, build-windows, build-linux, build-ohos]
    runs-on: ubuntu-latest
    # build-ohos 在未配置 OHOS_SDK_URL 时是「skipped」而非失败 —— 此时仍要发布
    # 其它平台产物，故条件放宽为「全部成功」或「仅鸿蒙被跳过」。
    if: ${{ inputs.upload-artifacts != false && (success() || needs.build-ohos.result == 'skipped') }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HeinPlay-${{ env.RELEASE_TAG }}
          body: "更新日志详见 CHANGELOG.md"
          # 除各平台安装包外，一并附上 Steam 库封面素材（仓库内 steamos-covers/），
          # 便于掌机用户把应用添加为「非 Steam 游戏」后设置库封面与图标。
          files: |
            artifacts/*
            steamos-covers/*.png
          fail_on_unmatched_files: true
