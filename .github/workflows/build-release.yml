name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.1.6），构建成功后会自动创建 v1.1.6 tag 并发布 Release'
        required: true
        type: string
      upload-artifacts:
        description: '是否上传构建产物'
        required: true
        default: true
        type: boolean
      with-ffmpeg-decoder:
        description: 'TV/tvLegacy/Mobile APK 是否打入带 mp3 解码(覆盖 mp2)的 ffmpeg 软解 AAR（会先编译该 AAR，耗时 30-40 分钟）'
        required: false
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ inputs.version }}

jobs:
  # ======================================================================
  # 编译带 mp3 解码(覆盖 IPTV mp2 音频)的 media3-ffmpeg decoder AAR。
  # ffmpeg 交叉编译 4 ABI + gradle 打包，单次 30-40 分钟，故作为独立 job：
  #  - 始终上传 decoder AAR artifact 供下载真机验证；
  #  - 仅当 with-ffmpeg-decoder=true 时，TV/tvLegacy/Mobile 才 needs 它并把 AAR 打入 APK。
  # 产物对应 tools/build_mp2_ffmpeg_decoder.sh（媒体库对齐 media3 1.9.2，mp2 由默认 mp3 解码器覆盖）。
  # ======================================================================
  build-ffmpeg-decoder:
    name: Build FFmpeg decoder AAR
    runs-on: ubuntu-latest
    # 仅在显式勾选 with-ffmpeg-decoder 时编译（重活，避免拖慢常规发版）；
    # 编译产物 decoder_ffmpeg-release.aar 上传 artifact，可下载真机验证；
    # 验证通过后建议直接提交该 AAR 到 hain_tv/deps/video_player_android/android/libs/，
    # 此后 TV/tvLegacy/Mobile 自动打包软解能力，无需再跑本 job。
    if: ${{ inputs.with-ffmpeg-decoder == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install ffmpeg build deps (yasm/nasm)
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm make gcc

      - name: Install NDK 26.1.10909125 via sdkmanager
        run: |
          ls "$ANDROID_HOME"
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" || \
          echo y | "$ANDROID_HOME/cmdline-tools/*/bin/sdkmanager" "ndk;26.1.10909125"

      - name: Build FFmpeg decoder AAR
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          NDK_VER: 26.1.10909125
        run: |
          ls -la "$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >/dev/null 2>&1 && echo "NDK26 就绪" || echo "!! NDK26 工具链缺失"
          bash tools/build_mp2_ffmpeg_decoder.sh

      - name: Upload decoder AAR
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-ffmpeg-decoder-aar
          path: hain_tv/deps/video_player_android/android/libs/decoder_ffmpeg-release.aar
          if-no-files-found: error

  build-tv:
    name: Build TV APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hain_tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Decode TV keystore
        run: |
          echo "${{ secrets.TV_KEYSTORE_BASE64 }}" | base64 -d > android/app/hain_tv_keystore.jks

      - name: Write TV key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=hain_tv_keystore.jks
          storePassword=${{ secrets.TV_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.TV_KEY_ALIAS }}
          keyPassword=${{ secrets.TV_KEY_PASSWORD }}
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build TV APK
        run: flutter build apk --target lib/main_tv.dart --flavor tv --release

      - name: Rename artifact
        run: |
          VERSION="$RELEASE_TAG"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-tv-release.apk "dist/heinplay-${VERSION}-tv.apk"

      - name: Upload TV APK
        if: ${{ inputs.upload-artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-tv-apk
          path: hain_tv/dist/heinplay-*-tv.apk
          if-no-files-found: error

  build-tvlegacy:
    name: Build tvLegacy APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hain_tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Decode tvLegacy keystore
        run: |
          echo "${{ secrets.TVLEGACY_KEYSTORE_BASE64 }}" | base64 -d > android/app/heinplay-tvlegacy.jks

      - name: Write tvLegacy key-tvlegacy.properties
        run: |
          cat > android/key-tvlegacy.properties <<EOF
          storeFile=heinplay-tvlegacy.jks
          storePassword=${{ secrets.TVLEGACY_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.TVLEGACY_KEY_ALIAS }}
          keyPassword=${{ secrets.TVLEGACY_KEY_PASSWORD }}
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build tvLegacy APK
        run: flutter build apk --target lib/main_tv.dart --flavor tvlegacy --release

      - name: Rename artifact
        run: |
          VERSION="$RELEASE_TAG"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-tvlegacy-release.apk "dist/heinplay-${VERSION}-tvLegacy.apk"

      - name: Upload tvLegacy APK
        if: ${{ inputs.upload-artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-tvlegacy-apk
          path: hain_tv/dist/heinplay-*-tvLegacy.apk
          if-no-files-found: error

  build-mobile:
    name: Build Mobile APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hain_tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Decode Mobile keystore
        run: |
          echo "${{ secrets.MOBILE_KEYSTORE_BASE64 }}" | base64 -d > android/app/heinplay-mobile.jks

      - name: Write Mobile key.properties
        run: |
          cat > android/key-mobile.properties <<EOF
          storeFile=heinplay-mobile.jks
          storePassword=${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.MOBILE_KEY_ALIAS }}
          keyPassword=${{ secrets.MOBILE_KEY_PASSWORD }}
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Mobile APK
        run: flutter build apk --target lib/main_mobile.dart --flavor mobile --release

      - name: Rename artifact
        run: |
          VERSION="$RELEASE_TAG"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-mobile-release.apk "dist/heinplay-${VERSION}-mobile.apk"

      - name: Upload Mobile APK
        if: ${{ inputs.upload-artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-mobile-apk
          path: hain_tv/dist/heinplay-*-mobile.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Portable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hain_tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      # mdk-sdk 的 GitHub latest 目录中已不存在 mdk-sdk-windows-x64.7z，
      # 导致 FVP 在 CI 中下载失败。这里手动下载与 fvp 0.37.x 对应的
      # v0.37.0 release 中的 x64 包并解压到插件目录，让 FVP 跳过下载。
      - name: Restore mdk-sdk cache
        id: cache-mdk
        uses: actions/cache/restore@v4
        with:
          path: hain_tv/windows/flutter/ephemeral/.plugin_symlinks/fvp/windows/mdk-sdk
          key: mdk-sdk-windows-${{ hashFiles('hain_tv/pubspec.lock') }}

      - name: Download mdk-sdk for FVP
        if: steps.cache-mdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $fvpWindows = "windows/flutter/ephemeral/.plugin_symlinks/fvp/windows"
          $marker = "$fvpWindows/mdk-sdk/lib/cmake/FindMDK.cmake"
          if (Test-Path $marker) {
            Write-Output "mdk-sdk 已存在，跳过下载"
            exit 0
          }
          $url = "https://github.com/wang-bin/mdk-sdk/releases/download/v0.37.0/mdk-sdk-windows-x64-vs2026.7z"
          $tmp7z = "$env:TEMP/mdk-sdk-windows-x64-vs2026.7z"
          Write-Output "Downloading mdk-sdk from $url"
          curl.exe -L --retry 3 -o $tmp7z $url
          $size = (Get-Item $tmp7z).Length
          if ($size -lt 1MB) {
            Write-Error "下载的 mdk-sdk 文件过小（$size 字节），可能失败"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path $fvpWindows | Out-Null
          7z x $tmp7z "-o$fvpWindows" -y
          if (-not (Test-Path $marker)) {
            Write-Error "解压后未找到 FindMDK.cmake"
            exit 1
          }
          Remove-Item $tmp7z -Force
          Write-Output "mdk-sdk 准备完成"

      - name: Build Windows release
        run: flutter build windows --target lib/main_windows.dart --release

      - name: Save mdk-sdk cache
        if: steps.cache-mdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: hain_tv/windows/flutter/ephemeral/.plugin_symlinks/fvp/windows/mdk-sdk
          key: ${{ steps.cache-mdk.outputs.cache-primary-key }}

      - name: Rename artifact
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          $distDir = "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $sourceDir = "build\windows\x64\runner\Release"
          $destZip = "$distDir\heinplay-$version-windows-portable.zip"
          if (Test-Path $destZip) { Remove-Item $destZip -Force }
          Compress-Archive -Path "$sourceDir\*" -DestinationPath $destZip -Force
          Write-Output "已生成: $destZip"

      - name: Upload Windows artifact
        if: ${{ inputs.upload-artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: heinplay-windows-portable
          path: hain_tv/dist/heinplay-*-windows-portable.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-tv, build-tvlegacy, build-mobile, build-windows]
    runs-on: ubuntu-latest
    if: ${{ inputs.upload-artifacts != false }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HeinPlay-${{ env.RELEASE_TAG }}
          body: "更新日志详见 CHANGELOG.md"
          files: artifacts/*
          fail_on_unmatched_files: true
