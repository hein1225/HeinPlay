org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# tvLegacy 专用：强制 Gradle 使用 D 盘工具集里的 JDK 21。
# 原因：Flutter 会优先采用 Android Studio 自带的 JBR（本机为 OpenJDK 25.0.3），而
# Gradle 8.12 内置的 Kotlin 脚本编译器解析不了该版本号，报
# java.lang.IllegalArgumentException: 25.0.3（JavaVersion.parse）。旧引擎链必须配
# Gradle 8.12 + JDK 21，故在此显式钉死 JDK（仅影响本工程，不动全局 flutter 配置）。
org.gradle.java.home=D:/heinplay-legacy/jdk-21.0.2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Pub 缓存与工程目录不在同一盘符时，Kotlin 增量编译缓存会跨根目录报错，关闭增量编译避免构建失败。
kotlin.incremental=false
kapt.incremental.apt=false
