name: video_player_ohos
description: HarmonyOS implementation of the video_player plugin for Flutter.
repository: https://gitcode.com/openharmony-tpc/flutter_packages/tree/main/packages/video_player
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
issue_tracker: https://gitcode.com/openharmony-tpc/flutter_packages/issues

version: 1.0.0+2

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  video_player_platform_interface: ^6.3.0
  # ⚠️ 2026-09-28（HeinPlay 本地 fork 化时修正）：
  # 上游写的是 monorepo 相对路径 `path: ../../pigeon`，一旦本包被复制出
  # flutter_packages 仓库（本工程即如此）就会解析失败：
  #   "video_player_ohos from path depends on pigeon from path which doesn't exist"
  # pigeon 仅用于生成 messages.g.dart / Messages.ets（开发期工具），运行时不需要，
  # 故改为 pub 版本。生成产物已入库，不影响构建。
  pigeon: ^26.0.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true
  plugin:
    implements: video_player
    platforms:
      ohos:
        dartPluginClass: OhosVideoPlayer
        package: io.flutter.plugins.videoplayer
        pluginClass: VideoPlayerPlugin

